<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">How Claude's SynthID-Text watermark works</title>
  <desc id="desc">Editorial diagram: Claude text generation selects words; low-stakes token choices are settled by a secret key plus preceding words instead of a random number generator, leaving a detectable pattern. A key-holder can then ask "what is the likelihood this was partly written by Claude?". Separate C2PA content credentials are attached to generated images and files. AI-generated editorial diagram, not source evidence.</desc>
  <rect width="1200" height="630" fill="#f7f4ee" />
  <text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#1c1917">How Claude's SynthID-Text watermark works</text>
  <text x="60" y="110" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#57534e">Low-stakes token choices are settled by a secret key — not a random number generator — leaving a detectable pattern</text>

  <!-- Text generation chain -->
  <rect x="60" y="150" width="240" height="90" rx="12" fill="#7c3aed" />
  <text x="180" y="192" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#ffffff">Claude generates text</text>
  <text x="180" y="220" text-anchor="middle" font-family="Arial" font-size="16" fill="#ede9fe">one word at a time</text>

  <line x1="300" y1="195" x2="360" y2="195" stroke="#1c1917" stroke-width="3" marker-end="url(#arr)" />
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1c1917" />
    </marker>
  </defs>

  <rect x="370" y="150" width="280" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="510" y="188" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#92400e">Many low-stakes choices</text>
  <text x="510" y="214" text-anchor="middle" font-family="Arial" font-size="16" fill="#92400e">"overcast" or "grey" both work</text>

  <line x1="650" y1="195" x2="710" y2="195" stroke="#1c1917" stroke-width="3" marker-end="url(#arr)" />

  <rect x="720" y="150" width="300" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text x="870" y="188" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#166534">Choice settled by key</text>
  <text x="870" y="214" text-anchor="middle" font-family="Arial" font-size="16" fill="#166534">key + preceding words, not RNG</text>

  <!-- Key input -->
  <rect x="720" y="60" width="300" height="60" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" />
  <text x="870" y="86" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#3730a3">Secret key held by Anthropic</text>
  <text x="870" y="108" text-anchor="middle" font-family="Arial" font-size="14" fill="#4338ca">signed EU Code of Practice, July 2026</text>
  <line x1="870" y1="120" x2="870" y2="150" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)" />

  <line x1="1020" y1="195" x2="1080" y2="195" stroke="#1c1917" stroke-width="3" marker-end="url(#arr)" />

  <rect x="1090" y="150" width="60" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text x="1120" y="185" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#b91c1c">watermark</text>
  <text x="1120" y="205" text-anchor="middle" font-family="Arial" font-size="13" fill="#b91c1c">in text</text>

  <!-- Detection box -->
  <rect x="150" y="300" width="900" height="110" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
  <text x="600" y="338" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#9a3412">Detection with the key answers one question</text>
  <text x="600" y="372" text-anchor="middle" font-family="Arial" font-size="18" fill="#9a3412">"What is the likelihood this was partly written by Claude?"</text>
  <text x="600" y="398" text-anchor="middle" font-family="Arial" font-size="15" fill="#c2410c">Does not confirm human authorship, other AI systems, or identify users · weak on short samples</text>

  <!-- C2PA box -->
  <rect x="150" y="450" width="900" height="120" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2" />
  <text x="600" y="488" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#155e75">Separate mechanism for images and files: C2PA</text>
  <text x="600" y="518" text-anchor="middle" font-family="Arial" font-size="17" fill="#155e75">cryptographically signed metadata: "Claude was involved in producing the file"</text>
  <text x="600" y="545" text-anchor="middle" font-family="Arial" font-size="15" fill="#0e7490">open industry standard (camera manufacturers, photo-editing software)</text>

  <text x="60" y="605" font-family="Arial" font-size="14" fill="#78716c">AI-generated editorial diagram · AI Newsroom · not source evidence · based on Anthropic explainer (2026-08-14) and Nature 634, pp. 818–823 (2024)</text>
</svg>
