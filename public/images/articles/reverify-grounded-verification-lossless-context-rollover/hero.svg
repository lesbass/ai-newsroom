<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">reverify: Model Proposes, Deterministic Tools Judge</text>

  <!-- LLM Box -->
  <rect x="40" y="70" width="150" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="115" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">LLM Agent</text>
  <text x="115" y="118" text-anchor="middle" font-size="11" fill="#1e40af">Proposes Claim</text>
  <text x="115" y="136" text-anchor="middle" font-size="10" fill="#64748b">"push rbp; mov rbp, rsp"</text>

  <!-- Arrow LLM to Verifier -->
  <line x1="190" y1="110" x2="255" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="222" y="100" text-anchor="middle" font-size="10" fill="#475569">claim</text>

  <!-- Deterministic Verifier Box -->
  <rect x="260" y="60" width="170" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="345" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Deterministic Verifier</text>
  <text x="345" y="106" text-anchor="middle" font-size="10" fill="#92400e">Checks bytes, patterns,</text>
  <text x="345" y="120" text-anchor="middle" font-size="10" fill="#92400e">instructions, imports</text>
  <text x="345" y="138" text-anchor="middle" font-size="10" fill="#92400e">against actual binary</text>

  <!-- Arrow Verdict to Decision -->
  <line x1="430" y1="110" x2="495" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="100" text-anchor="middle" font-size="10" fill="#475569">verdict</text>

  <!-- Decision Diamond -->
  <polygon points="555,70 605,110 555,150 505,110" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="555" y="106" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">VERIFIED?</text>
  <text x="555" y="120" text-anchor="middle" font-size="9" fill="#166534">yes only</text>

  <!-- VERIFIED path -->
  <line x1="605" y1="110" x2="650" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="655" y="85" width="55" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="682" y="108" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">FACT</text>
  <text x="682" y="122" text-anchor="middle" font-size="9" fill="#166534">ledger</text>

  <!-- REFUTED path -->
  <line x1="555" y1="150" x2="555" y2="210" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="505" y="215" width="100" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="555" y="230" text-anchor="middle" font-size="10" fill="#991b1b">REFUTED</text>
  <text x="555" y="244" text-anchor="middle" font-size="9" fill="#991b1b">model retries</text>

  <!-- Arrow back to LLM (retry) -->
  <path d="M505,233 Q360,270 115,150" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="320" y="268" text-anchor="middle" font-size="9" fill="#dc2626">corrected claim</text>

  <!-- Rollover box -->
  <rect x="40" y="200" width="310" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="195" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Lossless Context Rollover</text>
  <text x="195" y="240" text-anchor="middle" font-size="10" fill="#6d28d9">Ledger: ESTABLISHED / KNOWN FALSE</text>
  <text x="195" y="256" text-anchor="middle" font-size="10" fill="#6d28d9">replaces model-written compaction</text>
  <text x="195" y="272" text-anchor="middle" font-size="10" fill="#6d28d9">Fresh session starts from grounded facts</text>

  <!-- Legend -->
  <rect x="40" y="296" width="10" height="10" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="56" y="305" font-size="9" fill="#475569">LLM</text>
  <rect x="90" y="296" width="10" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="106" y="305" font-size="9" fill="#475569">Verifier</text>
  <rect x="155" y="296" width="10" height="10" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="171" y="305" font-size="9" fill="#475569">Verified</text>
  <rect x="220" y="296" width="10" height="10" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="236" y="305" font-size="9" fill="#475569">Refuted</text>
  <rect x="285" y="296" width="10" height="10" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="301" y="305" font-size="9" fill="#475569">Rollover</text>
</svg>
