<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c23152"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="640" y="60" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Model Hardware Standard (MHS)</text>
  <text x="640" y="90" font-family="system-ui, sans-serif" font-size="16" fill="#a0a0b0" text-anchor="middle">A shared driver spec for AI agents operating lab hardware</text>
  
  <!-- Agent block -->
  <rect x="80" y="200" width="200" height="120" rx="12" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="180" y="245" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">AI Agent</text>
  <text x="180" y="270" font-family="system-ui, sans-serif" font-size="13" fill="#a0a0b0" text-anchor="middle">MCP / CLI / Code</text>
  <text x="180" y="290" font-family="system-ui, sans-serif" font-size="13" fill="#a0a0b0" text-anchor="middle">read · write</text>
  
  <!-- MHS Driver block -->
  <rect x="400" y="180" width="240" height="160" rx="12" fill="#1a1a3e" stroke="#e94560" stroke-width="2"/>
  <text x="520" y="225" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e94560" text-anchor="middle">MHS Driver</text>
  <text x="520" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#c0c0d0" text-anchor="middle">Standardized interface</text>
  <text x="520" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#c0c0d0" text-anchor="middle">Device discovery</text>
  <text x="520" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#c0c0d0" text-anchor="middle">Capability reference</text>
  <text x="520" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#c0c0d0" text-anchor="middle">Safety constraints</text>
  
  <!-- Instrument blocks -->
  <rect x="780" y="120" width="180" height="80" rx="10" fill="#0f3460" stroke="#53a0b0" stroke-width="1.5"/>
  <text x="870" y="155" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Microscope</text>
  <text x="870" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#a0a0b0" text-anchor="middle">read: image · status</text>
  
  <rect x="780" y="220" width="180" height="80" rx="10" fill="#0f3460" stroke="#53a0b0" stroke-width="1.5"/>
  <text x="870" y="255" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Liquid Handler</text>
  <text x="870" y="275" font-family="system-ui, sans-serif" font-size="11" fill="#a0a0b0" text-anchor="middle">write: dispense · aspirate</text>
  
  <rect x="780" y="320" width="180" height="80" rx="10" fill="#0f3460" stroke="#53a0b0" stroke-width="1.5"/>
  <text x="870" y="355" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Robotic Arm</text>
  <text x="870" y="375" font-family="system-ui, sans-serif" font-size="11" fill="#a0a0b0" text-anchor="middle">write: move · grip</text>
  
  <!-- Arrows -->
  <line x1="280" y1="260" x2="400" y2="260" stroke="#e94560" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="230" x2="780" y2="160" stroke="#53a0b0" stroke-width="1.5"/>
  <line x1="640" y1="260" x2="780" y2="260" stroke="#53a0b0" stroke-width="1.5"/>
  <line x1="640" y1="290" x2="780" y2="360" stroke="#53a0b0" stroke-width="1.5"/>
  
  <!-- Bottom label -->
  <text x="640" y="460" font-family="system-ui, sans-serif" font-size="14" fill="#707090" text-anchor="middle">Model-agnostic · Any device with a programmable interface</text>
  <text x="640" y="485" font-family="system-ui, sans-serif" font-size="14" fill="#707090" text-anchor="middle">Anthropic + HHMI Janelia Research Campus · Research preview Aug 2026</text>
  
  <!-- Partner logos area -->
  <text x="640" y="550" font-family="system-ui, sans-serif" font-size="13" fill="#505070" text-anchor="middle">Partners: Genentech · UW Baker/Pinglay Labs · Carnegie Mellon · HHMI Janelia</text>
</svg>