<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="white" font-size="24" font-weight="bold">DeepSeek Harness (dsh) Architecture</text>
  <text x="400" y="68" text-anchor="middle" fill="#94a3b8" font-size="14">Everything is a Plugin · Powered by Cordis</text>
  
  <!-- Cordis Kernel (center) -->
  <rect x="325" y="140" width="150" height="60" rx="8" fill="url(#accent)" opacity="0.9"/>
  <text x="400" y="165" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Cordis Kernel</text>
  <text x="400" y="182" text-anchor="middle" fill="#e2e8f0" font-size="10">Plugin Lifecycle</text>
  
  <!-- Model Adapter (top left) -->
  <rect x="80" y="90" width="130" height="50" rx="6" fill="#1e40af" opacity="0.8"/>
  <text x="145" y="112" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Model Adapter</text>
  <text x="145" y="128" text-anchor="middle" fill="#93c5fd" font-size="10">DeepSeek / GPT / Claude</text>
  
  <!-- Tools (top right) -->
  <rect x="590" y="90" width="130" height="50" rx="6" fill="#1e40af" opacity="0.8"/>
  <text x="655" y="112" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Tools</text>
  <text x="655" y="128" text-anchor="middle" fill="#93c5fd" font-size="10">Shell / Files / Web / MCP</text>
  
  <!-- Agent Loop (bottom left) -->
  <rect x="80" y="260" width="130" height="50" rx="6" fill="#1e40af" opacity="0.8"/>
  <text x="145" y="282" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Agent Loop</text>
  <text x="145" y="298" text-anchor="middle" fill="#93c5fd" font-size="10">Standard / PTC / Minimal</text>
  
  <!-- Skills (bottom right) -->
  <rect x="590" y="260" width="130" height="50" rx="6" fill="#1e40af" opacity="0.8"/>
  <text x="655" y="282" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Skills</text>
  <text x="655" y="298" text-anchor="middle" fill="#93c5fd" font-size="10">User-defined workflows</text>
  
  <!-- Session (left) -->
  <rect x="195" y="185" width="100" height="45" rx="6" fill="#7c3aed" opacity="0.7"/>
  <text x="245" y="205" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Session</text>
  <text x="245" y="220" text-anchor="middle" fill="#ddd6fe" font-size="9">Append-only log</text>
  
  <!-- Sandbox (right) -->
  <rect x="505" y="185" width="100" height="45" rx="6" fill="#7c3aed" opacity="0.7"/>
  <text x="555" y="205" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Sandbox</text>
  <text x="555" y="220" text-anchor="middle" fill="#ddd6fe" font-size="9">Isolated execution</text>
  
  <!-- Storage (bottom center) -->
  <rect x="350" y="260" width="100" height="45" rx="6" fill="#7c3aed" opacity="0.7"/>
  <text x="400" y="280" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Storage</text>
  <text x="400" y="295" text-anchor="middle" fill="#ddd6fe" font-size="9">Plugin state</text>
  
  <!-- Arrows from Cordis to plugins -->
  <line x1="350" y1="170" x2="210" y2="115" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="450" y1="170" x2="590" y2="115" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="350" y1="170" x2="210" y2="280" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="450" y1="170" x2="590" y2="280" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="350" y1="170" x2="295" y2="205" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="450" y1="170" x2="505" y2="205" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="400" y1="200" x2="400" y2="260" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- Bottom labels -->
  <text x="400" y="340" text-anchor="middle" fill="#64748b" font-size="11">Model, tools, skills, session, sandbox, storage, loop — all replaceable plugins</text>
  <text x="400" y="360" text-anchor="middle" fill="#64748b" font-size="11">Config-layer composition · No privileged core to patch</text>
  <text x="400" y="385" text-anchor="middle" fill="#475569" font-size="10">Generated editorial diagram · AI Newsroom</text>
</svg>
